<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Your Shopping Cart</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/user.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #0d1117; color: #c9d1d9; }
    nav { background: #161b22; border-bottom: 1px solid #30363d; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
    nav a { color: #c9d1d9; text-decoration: none; margin-left: 15px; font-weight: 600; }
    .container { max-width: 800px; margin: 30px auto; padding: 0 20px; }
    .box { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 20px; margin-top: 20px; }
  </style>
</head>
<body>
  <nav>
    <h2 style="color:#fff;">TechCore Store</h2>
    <div>
      <a href="index.html">Home</a>
      <a href="cart.html" style="color:#2563eb;">Cart 🛒</a>
    </div>
  </nav>

  <div class="container">
    <h2 style="color:#fff;">Shopping Cart</h2>
    <div class="box">
      <div id="cartItemsList"></div>
      <div style="display:flex; justify-content:space-between; align-items:center; margin-top:20px; padding-top:15px; border-top:1px solid #30363d;">
        <h3>Total: <span id="cartTotalPrice" style="color:#38bdf8;">$0.00</span></h3>
        <a href="checkout.html" style="background:#2563eb; color:#fff; padding:10px 20px; border-radius:6px; text-decoration:none; font-weight:bold;">Proceed to Checkout</a>
      </div>
    </div>
  </div>

  <script>
    window.onload = function() {
      verifyUserSession();
      renderCartView();
    };
  </script>
</body>
</html>
