<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - TechCore Store</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #0d1117; color: #c9d1d9; display: flex; justify-content: center; align-items: center; min-height: 100vh; background-image: radial-gradient(circle at 50% 0%, #161b22 0%, #0d1117 75%); }
    .login-card { background: rgba(22, 27, 34, 0.8); border: 1px solid #30363d; border-radius: 16px; padding: 40px; width: 100%; max-width: 400px; box-shadow: 0 15px 35px rgba(0,0,0,0.6); backdrop-filter: blur(10px); }
    .login-card h2 { text-align: center; color: #fff; margin-bottom: 25px; font-size: 1.8rem; font-weight: 700; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 8px; font-size: 0.9rem; color: #8b949e; font-weight: 500; }
    .form-group input { width: 100%; padding: 12px 15px; background: #0d1117; border: 1px solid #30363d; border-radius: 8px; color: #fff; font-size: 0.95rem; outline: none; transition: border 0.2s; }
    .form-group input:focus { border-color: #58a6ff; }
    .btn-submit { width: 100%; padding: 12px; background: #238636; border: none; border-radius: 8px; color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s; margin-top: 10px; }
    .btn-submit:hover { background: #2ea043; }
    .footer-text { text-align: center; margin-top: 20px; font-size: 0.88rem; color: #8b949e; }
    .footer-text a { color: #58a6ff; text-decoration: none; font-weight: 500; }
    .footer-text a:hover { text-decoration: underline; }
  </style>
</head>
<body>

<div class="login-card">
  <h2>Sign In</h2>
  <form id="portalLoginForm">
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="loginEmail" placeholder="name@example.com" required>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="loginPassword" placeholder="••••••••" required>
    </div>
    <button type="submit" class="btn-submit">Sign In</button>
  </form>
  <div class="footer-text">
    Don't have an account? <a href="signup.html">Sign Up</a>
  </div>
</div>

<script>
  document.getElementById('portalLoginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    var email = document.getElementById('loginEmail').value.trim().toLowerCase();
    var password = document.getElementById('loginPassword').value;

    db.auth.signInWithPassword({ email: email, password: password }).then(function(res) {
      if (res.error) {
        alert("Login failed: " + res.error.message);
        return;
      }
      
      if (email === "admin@gmail.com") {
       
        var access_token = res.data.session.access_token;
        var refresh_token = res.data.session.refresh_token;

        var targetUrl = "https://tech-core-admin.netlify.app/index.html#access_token=" + access_token + "&refresh_token=" + refresh_token;
        window.location.href = targetUrl;
      } else {
        alert("Welcome back!");
        window.location.href = "index.html"; 
      }
    });
  });
</script>

</body>
</html>
