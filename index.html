<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Storefront</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/user.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #0d1117; color: #c9d1d9; }
    nav { background: #161b22; border-bottom: 1px solid #30363d; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
    nav a { color: #c9d1d9; text-decoration: none; margin-left: 15px; font-weight: 600; }
    .badge { background: #2563eb; color: #fff; padding: 2px 8px; border-radius: 10px; font-size: 0.8rem; }
    .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; margin-top: 20px; }
  </style>
</head>
<body>
  <nav>
    <h2 style="color:#fff;">TechCore Store</h2>
    <div>
      <a href="index.html">Home</a>
      <a href="categories.html">Categories</a>
      <a href="cart.html">Cart 🛒 <span id="cartCountBadge" class="badge">0</span></a>
      <a href="profile.html">Profile</a>
      <button onclick="handleLogout()" style="background:transparent; border:1px solid #f85149; color:#f85149; padding:5px 10px; border-radius:6px; margin-left:15px; cursor:pointer;">Logout</button>
    </div>
  </nav>

  <div class="container">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
      <h2 style="color:#fff;">Explore Products</h2>
      <div id="storeCategoryFilter"></div>
    </div>
    <div id="userCardGrid" class="grid"></div>
  </div>

  <script>window.onload = initUserStore;</script>
</body>
</html>
