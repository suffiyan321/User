<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/user.js"></script>
  <style>
    body { background: #0d1117; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .box { background: #161b22; border: 1px solid #30363d; padding: 30px; border-radius: 8px; width: 350px; }
    input { width: 100%; padding: 10px; margin: 10px 0 20px 0; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #fff; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background: #2563eb; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Create Account</h2>
    <label style="font-size:0.85rem;">Email</label>
    <input type="email" id="email" placeholder="user@gmail.com">
    <label style="font-size:0.85rem;">Password</label>
    <input type="password" id="password" placeholder="******">
    <button onclick="handleSignUp()">Sign Up</button>
    <p style="text-align:center; margin-top:15px; font-size:0.85rem; color:#8b949e;">
      Already have an account? <a href="login.html" style="color:#60a5fa;">Log In</a>
    </p>
  </div>
</body>
</html>
